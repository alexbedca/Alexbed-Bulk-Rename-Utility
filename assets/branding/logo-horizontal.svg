  <rect width="1400" height="400" fill="#0B0D1A"/>

  <!-- Mark (512 grid scaled to 280px) -->
  <g transform="translate(60 60) scale(0.546875)">
    <rect width="512" height="512" rx="112" fill="url(#bg)"/>
    <rect width="512" height="512" rx="112" fill="url(#glow)"/>
    <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
    <g fill="#FFFFFF">
